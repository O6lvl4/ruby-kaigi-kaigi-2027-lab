plugins:
  - rubocop-rails

AllCops:
  # The app runs on Ruby 4.0.7 / Rails 8.1.4 inside public/rails-runtime.wasm.
  TargetRubyVersion: 4.0
  TargetRailsVersion: 8.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - wasm/**/*
    - node_modules/**/*
    - vendor/**/*
    - dist/**/*

Style/Documentation:
  Exclude:
    - app/controllers/**/*
    - app/helpers/**/*
    - db/**/*
    - config/**/*

Style/FrozenStringLiteralComment:
  Enabled: false

Layout/LineLength:
  Max: 140

Metrics/MethodLength:
  Max: 15

Metrics/AbcSize:
  Max: 20

# StaticRecord collections are arrays, not Active Record relations.
Rails/FindEach:
  Enabled: false
