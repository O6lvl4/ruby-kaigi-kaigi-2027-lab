name: Experimental latest Ruby Rails Wasm proof
on:
  pull_request:
    paths:
      - 'experiments/latest-wasm/**'
      - '.github/workflows/latest-wasm-proof.yml'
permissions:
  contents: read
concurrency:
  group: latest-wasm-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: experiments/latest-wasm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '4.0.7'
          bundler: '4.0.20'
      - name: Build checksum-pinned Ruby and real Rails proof
        run: |
          mkdir -p evidence
          set -o pipefail
          scripts/rebuild.sh 2>&1 | tee evidence/clean-build.log
      - name: Install cloud test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify browser worker and interrupted flows
        run: |
          python3 -m http.server 4178 --bind 127.0.0.1 --directory browser > evidence/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4178/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
      - name: Upload experimental artifact and proof (never deploy)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: latest-wasm-proof-${{ github.event.pull_request.head.sha }}
          path: |
            experiments/latest-wasm/browser
            experiments/latest-wasm/evidence
            experiments/latest-wasm/.build/evidence
          include-hidden-files: true
          retention-days: 14
