name: Rails runtime (Ruby 4.0.7 / Rails 8.1.4 Wasm)
on:
  pull_request:
    paths:
      - 'wasm/**'
      - '.github/workflows/rails-runtime.yml'
  # Rebuild and publish a new runtime as a Release asset, e.g. tag rails-runtime-r3.
  # Then pin its URL and SHA-256 in scripts/fetch-runtime.mjs after review.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish (leave empty to build only)
        required: false
permissions:
  contents: read
concurrency:
  group: rails-runtime-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: wasm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '4.0.7'
          bundler: '4.0.20'
      - name: Verify worker lifecycle without booting Wasm
        run: node scripts/worker-lifecycle-test.mjs
      - name: Build checksum-pinned Ruby and real Rails proof
        run: |
          mkdir -p evidence
          set -o pipefail
          scripts/rebuild.sh 2>&1 | tee evidence/clean-build.log
      - name: Install cloud test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify browser worker and interrupted flows
        run: |
          python3 -m http.server 4178 --bind 127.0.0.1 --directory browser > evidence/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4178/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
      - name: Upload runtime and proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rails-runtime-${{ github.sha }}
          path: |
            wasm/browser
            wasm/evidence
            wasm/.build/evidence
          include-hidden-files: true
          retention-days: 14
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: proof
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rails-runtime-${{ github.sha }}
          path: runtime
      - name: Publish rails-runtime.wasm with its manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          cp runtime/browser/foundation.wasm rails-runtime.wasm
          cp runtime/browser/runtime-manifest.json runtime-manifest.json
          sha256sum rails-runtime.wasm | tee rails-runtime.wasm.sha256
          gh release create "$TAG" rails-runtime.wasm runtime-manifest.json rails-runtime.wasm.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Ruby 4.0.7 / Rails 8.1.4 Wasm built by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID from $GITHUB_SHA."
